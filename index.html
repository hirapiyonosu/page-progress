<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="同人誌の表紙から裏表紙までをページごとに管理して、入稿予定日までの進み具合を出す進捗表です。記録はこの端末の中だけに保存されます。">
<meta name="theme-color" content="#1f1d1b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="執筆進捗管理表">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>執筆進捗管理表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 原稿用紙の地に、墨とひと色の差し色。上に本の情報と全体の数字、下に本の構成 */
:root{
  --paper:#fbfaf7; --panel:#ffffff; --ink:#1f1d1b; --sub:#6b6560; --line:#e4e0da;
  --tone:#d9d4cd; --accent:#1f62c9; --accent-ink:#1a52a8; --accent-soft:#e7effc; --accent-fg:#ffffff; --hm:#c8306a; --hm-soft:#fde6ef; --c-goal:#c23a32; --c-dl:#2f6fd0; --c-pr:#9a6000; --c-gs:#8456c9; --tag-fg:#ffffff;
  --done:#1f1d1b; --done-fg:#ffffff; --half:#fdebd6; --half-fg:#a95a0c; --half-line:#e8892b; --book:#e8892b;
  --field-bg:#ffffff; --field-line:#8a837c; --btn-line:#77716a; --btn-shadow:0 1px 0 rgba(0,0,0,.08);
  --good:#2f8a5b; --warn:#c9781a; --bad:#c2453c; --drop:#f6efe6;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a1918; --panel:#232120; --ink:#efebe6; --sub:#a39d96; --line:#36332f;
  --tone:#4a4642; --accent:#6ea2f5; --accent-ink:#9cc0ff; --accent-soft:#1d2a3e; --accent-fg:#0f1b2d; --hm:#f27ca5; --hm-soft:#43212e; --c-goal:#f06b6b; --c-dl:#6fa1f2; --c-pr:#e3a23c; --c-gs:#b393ea; --tag-fg:#1a1918;
  --done:#efebe6; --done-fg:#1a1918; --half:#3d2c1b; --half-fg:#f5b273; --half-line:#f09a45; --book:#f09a45;
  --field-bg:#161514; --field-line:#77716a; --btn-line:#8a837c; --btn-shadow:0 1px 0 rgba(0,0,0,.4);
  --good:#5cc08a; --warn:#e9a24a; --bad:#e8766d; --drop:#2c2723; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a1918; --panel:#232120; --ink:#efebe6; --sub:#a39d96; --line:#36332f;
  --tone:#4a4642; --accent:#6ea2f5; --accent-ink:#9cc0ff; --accent-soft:#1d2a3e; --accent-fg:#0f1b2d; --hm:#f27ca5; --hm-soft:#43212e; --c-goal:#f06b6b; --c-dl:#6fa1f2; --c-pr:#e3a23c; --c-gs:#b393ea; --tag-fg:#1a1918;
  --done:#efebe6; --done-fg:#1a1918; --half:#3d2c1b; --half-fg:#f5b273; --half-line:#f09a45; --book:#f09a45;
  --field-bg:#161514; --field-line:#77716a; --btn-line:#8a837c; --btn-shadow:0 1px 0 rgba(0,0,0,.4);
  --good:#5cc08a; --warn:#e9a24a; --bad:#e8766d; --drop:#2c2723; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:24px}
h1{font-family:var(--f-display);font-weight:900;font-size:26px;margin:0;line-height:1.25;text-wrap:balance}
h2{font-family:var(--f-display);font-size:17px;margin:0}
/* 入力欄：地の色＋濃い枠（くぼんだ見た目）。押すボタンとは形を変える */
input[type=date],input[type=text],input[type=number],select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--field-bg);border:1px solid var(--field-line);border-radius:4px;padding:5px 8px;min-width:0;max-width:100%;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
input[type=date]:focus,input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);outline:none}
::placeholder{color:var(--sub);opacity:.75}
input[type=date],input[type=number]{font-family:var(--f-num)}
input:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ボタンの役割：.btn＝大事な操作（青の塗り）／.ghost＝普通の操作（濃い枠＋影）／.ghost.danger＝消す操作（赤）／.tbtn＝控えめな操作（文字だけ） */
.ghost{font:inherit;font-size:13px;font-weight:500;background:var(--panel);color:var(--ink);border:1.5px solid var(--btn-line);border-radius:8px;padding:5px 11px;cursor:pointer;white-space:nowrap;box-shadow:var(--btn-shadow)}
.ghost:hover{border-color:var(--accent);background:var(--accent-soft)}
.ghost:active,.btn:active,.cell:active,.topb:active{transform:translateY(1px);box-shadow:none}
.ghost:disabled{opacity:.45;cursor:default;box-shadow:none}
.ghost.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:700}
.ghost.danger{color:var(--bad);border-color:var(--bad)}
.ghost.danger:hover{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-fg);border:1.5px solid var(--accent);border-radius:8px;padding:8px 14px;cursor:pointer;box-shadow:var(--btn-shadow)}
.btn:hover{filter:brightness(1.08)}
.tbtn{font:inherit;font-size:13px;background:transparent;border:0;color:var(--accent-ink);padding:2px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (pointer:coarse){.ghost,.btn{min-height:36px}}

/* いま開いている本の帯（スクロールしても上に残る） */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band,var(--ink))}
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--band,var(--ink));color:var(--band-fg,#fff);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.band-in{max-width:980px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.band .who{display:grid;min-width:0;flex:1 1 14rem}
.band .eyebrow{font-size:11px;letter-spacing:.1em;opacity:.8}
.band h1{font-size:20px;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band .meta{font-size:12px;opacity:.9}
.band .now{display:flex;gap:14px;align-items:baseline;font-family:var(--f-num);white-space:nowrap}
.band .now b{font-size:22px;font-weight:500}
.band .now span{font-family:var(--f-body);font-size:11px;opacity:.85;margin-left:2px}
.band .helpbtn{font:inherit;font-size:13px;font-weight:700;background:transparent;color:inherit;border:1.5px solid currentColor;border-radius:999px;padding:4px 12px;cursor:pointer;opacity:.95}
.band .helpbtn:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.band .undo{display:flex;gap:6px}
.band .ub{font:inherit;font-size:12px;background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:3px 8px;cursor:pointer;opacity:.95;white-space:nowrap}
.band .ub:disabled{opacity:.4;cursor:default}
.band .ub:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@media (max-width:560px){.band .ub .t{display:none}}
@media (max-width:480px){.band h1{font-size:17px}.band .now b{font-size:18px}.band .eyebrow{display:none}.band-in{padding-block:8px;gap:6px}.band .now{gap:8px}.band .undo{gap:4px}.band .ub{padding:3px 7px}.band .helpbtn{padding:3px 9px;font-size:12px}}
.lead{margin:0;font-size:13px;color:var(--sub)}
#dialog:empty,#bookbar:empty,#introbox:empty{display:none}
.sec-h{display:grid;gap:2px}
/* 本の選択と保存 */
.manage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.manage{grid-template-columns:minmax(0,1fr)}}
.manage .box{display:grid;gap:8px;align-content:start}
.manage .box.full{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:14px}
.snaps{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.snaps li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.snaps li:last-child{border-bottom:0}
.snaps .when{font-family:var(--f-num);font-size:12px;color:var(--sub)}
.snaps .lbl{flex:1 1 8rem;min-width:0}
details.snapfold{border:1px solid var(--line);border-radius:8px}
details.snapfold>summary{cursor:pointer;padding:8px 12px;font-size:13px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.snapfold>summary::-webkit-details-marker{display:none}
details.snapfold>summary::after{content:"開く ▾";font-size:12px;color:var(--sub)}
details.snapfold[open]>summary::after{content:"閉じる ▴"}
details.snapfold .snaps{padding:0 12px 8px}
.snapfold .cap{padding:0 12px 4px;margin:0}
.prune{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--sub);padding:0 12px 8px;border-bottom:1px dashed var(--line);margin-bottom:6px}
.prune input{width:4rem;margin:0 4px}
.snaprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.snaprow input{flex:1 1 12rem}
.undoset{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub)}
.undoset input{width:4.5rem}
.editbar{display:flex;gap:6px;flex-wrap:wrap}
.manage .k{font-size:13px;font-weight:700}
.manage .acts{display:flex;gap:6px;flex-wrap:wrap}
.manage .io{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center}
.manage .io .lead{font-size:12px}
.manage select{width:100%;font-size:15px}
.where{font-size:12px;color:var(--sub)}
/* はじめての案内 */
.intro{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.intro h2{font-size:16px}
.intro ol{margin:0;padding-left:1.4em;display:grid;gap:8px;font-size:14px}
.intro li .d{display:block;font-size:13px;color:var(--sub)}
.intro .lead{font-size:13px}
.intro .acts{display:flex;gap:8px;flex-wrap:wrap}
/* 本の設定 */
details.settings{background:var(--panel);border:1px solid var(--line);border-radius:10px}
details.mgmt .manage{padding:4px 16px 16px}
details.settings>summary{cursor:pointer;padding:12px 16px;font-family:var(--f-display);font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.settings>summary::-webkit-details-marker{display:none}
details.settings>summary::after{flex:none;white-space:nowrap;content:"開く ▾";font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--sub)}
details.settings[open]>summary::after{content:"閉じる ▴"}
details.settings>summary small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--sub);margin-left:6px}
.settings-body{padding:0 16px 16px;display:grid;gap:22px}
/* 本の設定の各まとまり：見出し → 説明 → 操作 の順で、まとまりの中は詰める */
.grp{display:grid;gap:6px;align-content:start}
.grp>.sub-h{margin-bottom:-2px}
.grp p,.subopt p{margin:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.swatches input[type=color]{width:38px;height:30px;padding:0 2px;border-radius:6px;cursor:pointer}
.sub-h{font-size:13px;font-weight:700;margin:0}
.plist{display:grid;gap:6px;justify-items:start}
.prow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow input[type=text]{width:9rem}
.prow .left{font-family:var(--f-num);font-size:12px;color:var(--sub);min-width:4.5rem}
.x{border:0;background:transparent;color:var(--sub);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--bad)}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.hours{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.hours label{display:flex;gap:4px;align-items:center;font-size:13px}
.hours input{width:4rem}
.offs{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.offs .k{font-size:13px}
.offs>.pnote:last-child{flex:1 1 16rem}
/* 上のチェックを入れたときだけ効く設定は、一段下げて線でつなぐ */
.subopt{margin-left:9px;padding-left:16px;border-left:2px solid var(--line);display:grid;gap:6px}
.subopt:empty{display:none}
.offchip{display:inline-flex;align-items:center;font-family:var(--f-num);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 2px 1px 10px;background:var(--paper)}
#f-memo{width:100%;min-height:4.5rem;resize:vertical}
.oddbar{position:fixed;z-index:7;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + var(--band-h,64px) + 10px);width:min(560px,calc(100vw - 24px));display:flex;gap:12px;align-items:center;background:var(--panel);color:var(--ink);border:1.5px solid var(--bad);border-left:6px solid var(--bad);border-radius:10px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.22)}
.oddbar[hidden]{display:none}
.oddbar p{margin:0;flex:1;font-size:14px;line-height:1.6}
.oddbar b{color:var(--bad)}
.oddbar .btn{flex:none;min-width:4.5em}
@media (prefers-reduced-motion:no-preference){.oddbar:not([hidden]){animation:oddin .25s ease}@keyframes oddin{from{opacity:0;transform:translate(-50%,-8px)}}}
.notice{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--warn);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px}
.notice p{margin:0;font-size:13px;flex:1 1 20rem}
.notice .acts{display:flex;gap:8px;flex-wrap:wrap}
.fact .note.bad{color:var(--bad)}
.spaces{margin:10px 0 0}
.chart .acts{display:flex;justify-content:flex-end}
.chart .gl{stroke:var(--sub);stroke-dasharray:2 3}
.chart .dl{stroke:var(--sub);stroke-dasharray:2 3}
.ms li.k-goal .lbl,.ms li.k-goal .fd{color:var(--c-goal)} .ms li.k-dl .lbl,.ms li.k-dl .fd{color:var(--c-dl)} .ms li.k-pr .lbl,.ms li.k-pr .fd{color:var(--c-pr)} .ms li.k-ev .lbl,.ms li.k-ev .fd{color:var(--hm)}
.ms li.k-pr .lbl{font-weight:500}
.tpl{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:12px}
.tplbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;align-content:start}
.tplbox ul{margin:0;padding-left:1.2em;font-size:13px;display:grid;gap:2px}
.shimg{width:100%;max-width:720px;border:1px solid var(--line);border-radius:6px;background:#fbfaf7}
/* 横の窓（カレンダーとタイマー） */
.side{position:fixed;z-index:8;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + var(--band-h,64px) + 12px);width:340px;max-height:calc(100vh - var(--band-h,64px) - 24px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.side[hidden]{display:none}
.side-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.side-b{overflow:auto;scrollbar-gutter:stable;padding:12px 14px;display:grid;gap:10px}
.band .ub.on{background:var(--band-fg,#fff);color:var(--band,var(--ink))}
@media (min-width:1400px){body.side-open .wrap,body.side-open .band-in{margin-left:max(16px,calc((100vw - 980px - 380px) / 2));margin-right:auto}}
@media (max-width:720px){
  .side{left:0;right:0;bottom:0;top:auto;width:auto;max-height:58vh;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  body.side-open .wrap{padding-bottom:60vh}
  body.side-open .status{bottom:calc(58vh + 8px)}
}
.cal{display:grid;gap:10px}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav b{flex:1;text-align:center;font-family:var(--f-display);font-size:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-grid .wd{font-size:11px;color:var(--sub);text-align:center}
.wd.sun,.cd.sun .dn{color:var(--bad)} .wd.sat,.cd.sat .dn{color:#3d7dd8}
.cd{position:relative;font:inherit;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:4px 0 2px;min-height:50px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;overflow:hidden}
.cd:hover{border-color:var(--line)}
.cd .dn{position:relative;font-family:var(--f-num);font-size:12px;line-height:1.2;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cd.today .dn{background:var(--accent);color:var(--accent-fg)!important;font-weight:700}
.tg{display:block;max-width:100%;font-size:9.5px;line-height:1.3;font-weight:700;border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:clip;font-style:normal}
.t-ev{color:var(--tag-fg);background:var(--hm)}
.t-goal{color:var(--tag-fg);background:var(--c-goal)} .t-dl{color:var(--tag-fg);background:var(--c-dl)} .t-pr{color:var(--tag-fg);background:var(--c-pr)} .t-gs{color:var(--tag-fg);background:var(--c-gs)}
.cd .tg+.tg{margin-top:1px}
.cd.is-goal{background:color-mix(in srgb,var(--c-goal) 10%,transparent)} .cd.is-dl{background:color-mix(in srgb,var(--c-dl) 10%,transparent)} .cd.is-pr{background:color-mix(in srgb,var(--c-pr) 10%,transparent)} .cd.is-gs{background:color-mix(in srgb,var(--c-gs) 10%,transparent)}
.cdn i{width:8px;height:8px;border-radius:50%;display:inline-block}
.cdn.c-goal b{color:var(--c-goal)} .cdn.c-dl b{color:var(--c-dl)} .cdn.c-pr b{color:var(--c-pr)} .cdn.c-ms b{color:var(--good)}
.topb{font:inherit;font-size:10.5px;line-height:1.4;padding:1px 6px;margin-left:6px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--sub);cursor:pointer;font-family:var(--f-body)}
.topb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.t-hol{color:var(--bad);font-weight:400;padding:0}
.cd.is-ev{background:var(--hm-soft)}
.hm{position:absolute;left:50%;top:-2px;width:34px;height:34px;transform:translateX(-50%) rotate(-8deg);fill:none;stroke:var(--hm);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.hm .sp{stroke-width:1.3;opacity:.0}
.cd.is-ev .dn{font-weight:700;color:var(--hm)!important}
.cd.is-ev .tg{margin-top:4px}
.cdns{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:720px){.cdns{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.cdn{flex:none}}
.cdn{position:relative;display:flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px 4px 10px;font-size:12px;border:1px solid var(--line)}
.cdn b{font-size:14px;margin-left:4px;font-family:var(--f-num)}

.stagecfg{display:grid;gap:0;background:var(--panel);border:1px dashed var(--accent);border-radius:10px;padding:4px 14px;font-size:13px}
.stagecfg .cfg{display:grid;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.stagecfg .cfg:last-child{border-bottom:0}
.stagecfg .k{font-weight:700}
.stagecfg .ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.stagecfg label{display:flex;gap:4px;align-items:center}
.stagecfg input[type=text]{width:6.5rem}
.stagecfg input[type=number]{width:4.2rem}
.stagecfg #wlist{width:16rem;max-width:100%}
.stagecfg .hint{margin:0;font-size:12px;color:var(--sub)}
.stagecfg .sum{font-family:var(--f-num);font-size:13px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.stagecfg .sum.ng{color:var(--bad);border-color:var(--bad)}
.stagecfg .sum.ok{color:var(--good)}
.status{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;font-size:12px;background:var(--panel);color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:5px 12px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:calc(100vw - 24px)}
.status:empty{display:none}
.status.err{color:var(--bad);border-color:var(--bad)}
.dialog{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:16px;display:grid;gap:10px}
.dialog textarea{width:100%;min-height:8rem;font-family:var(--f-num);font-size:12px}
.dialog .acts{display:flex;gap:8px;flex-wrap:wrap}
.dialog p{margin:0;font-size:13px;color:var(--sub)}
@media (prefers-reduced-motion:no-preference){.bar .fill,.stage .mini i{transition:width .4s ease}}
</style>

<header class="band" id="band" aria-label="いま開いている本"></header>
<div class="wrap">
  <div id="introbox"></div>
  <div id="bookbar"></div>
  <div id="dialog"></div>
  <div id="app"><p class="pnote">読み込み中…</p></div>
</div>
<aside class="side" id="side" aria-label="カレンダーとタイマー" hidden></aside>
<div class="status" id="status" role="status"></div>

  const bandH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--band-h")) || 64;
  const sheet = document.querySelector(".sheet"), head = document.querySelector(".sheet-head");
  let pick = null;
  if (sheet && head && sheet.getBoundingClientRect().top >= bandH - 1) pick = { sel: ".sheet-head", y: head.getBoundingClientRect().top };
  else {
    const top = bandH + (head ? head.offsetHeight : 0) + 80;
    const r = [...document.querySelectorAll(".row[data-id],.erow[data-id]")].find(x => x.getBoundingClientRect().bottom > top);
    if (r) pick = { sel: '.row[data-id="' + r.dataset.id + '"],.erow[data-id="' + r.dataset.id + '"]', y: r.getBoundingClientRect().top };

function move(i, dir) {

  if (el.id === "undo-max") { try { localStorage.setItem(KEY + "-undo-max", String(Math.min(200, Math.max(1, Math.round(+el.value || 30))))); } catch (_) {} renderBookbar(); setStatus("元に戻せる回数を " + undoMax() + " 回にしました"); return; }
  if (el.id === "snap-label") return;
  if (el.id === "book-select") { calSel = null; current = el.value; pagesMsg = ""; editMode = false; editSnap = null; settingsOpen = null; render(); rememberCurrent(); setStatus("「" + book().title + "」に切り替えました"); return; }
  if (el.dataset.book === "color") { if (/^#[0-9a-f]{6}$/i.test(el.value)) { b.color = el.value; touch(); } return; }
  if (el.dataset.book) { if (el.type === "date" && !el.value && el.dataset.book !== "eventDate") { render(); return; } b[el.dataset.book] = el.type === "text" ? el.value.trim() || (el.dataset.book === "title" ? "無題" : "") : el.value; touch(el.tagName !== "TEXTAREA"); return; }
  if (el.dataset.pages) { setPages(el.dataset.pages, el.value); return; }
  if (el.dataset.wlist) {
    const list = el.value.split(/[,、，\s]+/).map(Number).filter(v => isFinite(v) && v >= 0);
    b.weights = list.length ? [...new Set(list)].sort((x, y) => x - y) : [0, 1];
    touch(); return;
  }
  if (el.dataset.num === "buffer") { b.buffer = Math.min(90, Math.max(0, Math.round(+el.value || 0))); reposition(b, "goal"); touch(); return; }
  if (el.dataset.usehours) { b.useHours = el.checked; touch(); return; }
  if (el.dataset.holsun) { b.holSun = el.checked; touch(); return; }
  if (el.dataset.hour != null) { b.hours[+el.dataset.hour] = Math.min(24, Math.max(0, +el.value || 0)); touch(); return; }
  if (el.dataset.pl != null) { b.prints[+el.dataset.pl].label = el.value.trim(); touch(); return; }
  if (el.dataset.pd != null) { const x = b.prints[+el.dataset.pd]; x.date = el.value; reposition(b, "print:" + x.id); touch(); return; }
  if (el.dataset.gt != null) { b.rows[+el.dataset.gt].gt = el.value; touch(); return; }
  if (el.dataset.gd != null) { b.rows[+el.dataset.gd].gd = el.value; touch(); return; }
  if (el.dataset.tm) {
    const cfg = tmCfg(); cfg[el.dataset.tm] = el.type === "checkbox" ? el.checked : el.dataset.tm === "snd" ? el.value : +el.value;
    try { localStorage.setItem(KEY + "-pomo-cfg", JSON.stringify(cfg)); } catch (_) {}
    if (!TM.running) TM.remain = 0;
    // 設定欄は作り直さない（続けて別の欄を触れるように）。表示だけ更新
    const sl = document.getElementById("tm-setline"); if (sl) sl.innerHTML = tmSetHtml();
    tmPaint(); return;
  }
  if (el.dataset.half) { b.half = Math.min(99, Math.max(1, Math.round(+el.value || 50))); touch(); return; }
  if (el.dataset.share) { b.shares[+el.dataset.share] = Math.max(0, +el.value || 0); touch(); return; }
  if (el.dataset.stage) { b.stages[+el.dataset.stage] = el.value.trim() || STAGE_DEFAULTS[+el.dataset.stage]; touch(); return; }
  if (el.dataset.msOk != null) { b.milestones[+el.dataset.msOk].ok = el.checked; touch(); return; }
  if (el.dataset.msDate != null) { b.milestones[+el.dataset.msDate].date = el.value; touch(); return; }
  if (el.dataset.msLabel != null) { b.milestones[+el.dataset.msLabel].label = el.value; touch(false); return; }
  if (el.dataset.m != null) { b.rows[+el.dataset.m].m = el.value; touch(false); return; }
  if (el.dataset.f) {
    const r = b.rows[+el.dataset.i], f = el.dataset.f;
    if (f === "pc") { const v = Math.max(0, Math.round(+el.value || 0)); if (r.w === r.pc) r.w = v; r.pc = v; }
    else if (f === "w") r.w = Math.max(0, +el.value || 0);
    else r.note = el.value;
    if (f === "note") { touch(false); return; }
    // 頁数や重みを変えると上の進み具合（奇数の注意書きなど）の高さが変わるので、触っている行を同じ高さに保つ。
    // 続けて上げ下げできるように、作り直した入力欄にフォーカスを戻す
    const id = el.id;
    keepRowAt(el.closest(".erow"), () => touch());
    const again = document.getElementById(id); if (again) again.focus({ preventScroll: true });
  }
});
// 別の端末で更新した内容を、画面に戻ってきたときに取り込む
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || store.kind !== "db" || saving || dirtyIds.size) return;
  const a = document.activeElement; if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
  try {
    const snap = await store.col.get();
    const remote = {}; snap.docs.forEach(d => { const b = normalize(d.data()); remote[b.id] = b; });
    if (!Object.keys(remote).length || dirtyIds.size) return;
    books = remote; if (!books[current]) current = Object.keys(books)[0];
    writeLocal(); render();
  } catch (_) {}
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && side && !$("#dialog").innerHTML) { setSide(""); return; }
  if (!(e.ctrlKey || e.metaKey) || helpOpen) return;
  const a = document.activeElement;
  if (a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && /^(text|number|date)$/.test(a.type)))) return;
  const k = e.key.toLowerCase();
  if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
});
window.addEventListener("resize", () => { const h = $("#band").offsetHeight; if (h) document.documentElement.style.setProperty("--band-h", h + "px"); const sh = document.querySelector(".sheet-head"); if (sh && sh.offsetHeight) document.documentElement.style.setProperty("--sh-h", sh.offsetHeight + "px"); });
document.addEventListener("toggle", e => { if (e.target.id === "mgmt") { mgmtOpen = e.target.open; try { localStorage.setItem(KEY + "-mgmt-open", mgmtOpen ? "1" : "0"); } catch (_) {} } if (e.target.id === "settings") settingsOpen = e.target.open; if (e.target.id === "snapfold") snapsOpen = e.target.open; }, true);
(async function start() {
  await initStore();
  render();
})();
</script>

<script>
// ホーム画面に追加したあと、ネットなしでも開けるようにする
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
